client_max_body_size 20m;
limit_req_status 429;
limit_req_log_level warn;
error_page 429 = @rate_limited_json;

location @rate_limited_json {
    internal;
    default_type application/json;
    return 429 '{"success":false,"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","data":null}';
}

location = /gateway/health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP","component":"gateway"}';
}

location = /api/auth/sms-code {
    limit_req zone=sms_per_ip burst=1 nodelay;
    proxy_pass http://backend_pool/auth/sms-code;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location = /api/actuator/health {
    limit_req zone=api_per_ip burst=60 nodelay;
    proxy_pass http://backend_pool/actuator/health;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location ^~ /api/actuator {
    default_type application/json;
    return 404 '{"success":false,"code":"NOT_FOUND","message":"资源不存在","data":null}';
}

location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    proxy_pass http://backend_pool/;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# Compatibility for media URLs stored before /api became the public prefix.
location /media/object/ {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location /uploads/ {
    proxy_pass http://backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

location / {
    proxy_pass http://frontend_pool;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
