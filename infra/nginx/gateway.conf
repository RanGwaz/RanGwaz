worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    log_format gateway '$remote_addr - $request_id [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" upstream=$upstream_addr '
                       'upstream_time=$upstream_response_time request_time=$request_time';
    access_log /var/log/nginx/access.log gateway;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sms_per_ip:10m rate=3r/m;

    upstream backend_pool {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend_pool {
        least_conn;
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        server_name _;
        include /etc/nginx/vibelo/gateway.routes.conf;
    }
}
