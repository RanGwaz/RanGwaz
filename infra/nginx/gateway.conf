worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    log_format gateway '$remote_addr - $request_id [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" upstream=$upstream_addr '
                       'upstream_time=$upstream_response_time request_time=$request_time';
    access_log /var/log/nginx/access.log gateway;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sms_per_ip:10m rate=3r/m;

    upstream backend_pool {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend_pool {
        least_conn;
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 20m;
        limit_req_status 429;
        error_page 429 = @rate_limited_json;

        location @rate_limited_json {
            internal;
            default_type application/json;
            return 429 '{"success":false,"code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","data":null}';
        }

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","component":"gateway"}';
        }

        location = /api/auth/sms-code {
            limit_req zone=sms_per_ip burst=1 nodelay;
            proxy_pass http://backend_pool/auth/sms-code;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location = /api/actuator/health {
            limit_req zone=api_per_ip burst=60 nodelay;
            proxy_pass http://backend_pool/actuator/health;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location ^~ /api/actuator {
            default_type application/json;
            return 404 '{"success":false,"code":"NOT_FOUND","message":"资源不存在","data":null}';
        }

        location /api/ {
            limit_req zone=api_per_ip burst=60 nodelay;
            proxy_pass http://backend_pool/;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        # Compatibility for media URLs stored before /api became the public prefix.
        location /media/object/ {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location /uploads/ {
            proxy_pass http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
