worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    log_format gateway '$remote_addr - $request_id [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" upstream=$upstream_addr '
                       'upstream_time=$upstream_response_time request_time=$request_time';
    access_log /var/log/nginx/access.log gateway;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=sms_per_ip:10m rate=3r/m;

    upstream backend_pool {
        least_conn;
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend_pool {
        least_conn;
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VIBELO_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Docker healthcheck must remain HTTP. Every other HTTP request is sent to
    # the canonical HTTPS origin without trusting the incoming Host header.
    server {
        listen 80 default_server;
        server_name _;

        location = /gateway/health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","component":"gateway"}';
        }

        location / {
            return 308 https://vibelo.xin$request_uri;
        }
    }

    # Reject direct-IP and unknown-SNI TLS handshakes before serving a domain
    # certificate. Exact domain blocks below still win Nginx name selection.
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
    }

    # www is an alias only; application traffic and CORS use one canonical
    # origin. The certificate must still cover www.vibelo.xin.
    server {
        listen 443 ssl;
        http2 on;
        server_name www.vibelo.xin;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        return 308 https://vibelo.xin$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name vibelo.xin;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        include /etc/nginx/vibelo/gateway.routes.conf;
    }
}
