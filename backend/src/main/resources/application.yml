# Backend runtime configuration for local development.
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
spring:
  application:
    name: rangwaz-image-site
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rangwaz_image_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:rangwaz}
    password: ${SPRING_DATASOURCE_PASSWORD:rangwaz123}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:12}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:800ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        linger.ms: 20
        batch.size: 32768
    consumer:
      group-id: vibelo-behavior-writer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.rangwaz.imagesite.entity
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  features:
    publishing-enabled: ${APP_FEATURE_PUBLISHING_ENABLED:false}
  web:
    allowed-origin-patterns: ${APP_WEB_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET:dev-only-change-this-token-secret-before-public-deployment}
    token-ttl-seconds: ${APP_AUTH_TOKEN_TTL_SECONDS:86400}
  upload-root: storage/uploads
  public-upload-prefix: /uploads
  recommendation:
    vector-service-url: ${VECTOR_SERVICE_URL:http://127.0.0.1:8091}
    vector-enabled: ${VECTOR_ENABLED:true}
    model-service-url: ${MODEL_SERVICE_URL:http://127.0.0.1:8092}
    model-recall-enabled: ${MODEL_RECALL_ENABLED:false}
    model-ranking-enabled: ${MODEL_RANKING_ENABLED:false}
    model-connect-timeout-ms: ${MODEL_CONNECT_TIMEOUT_MS:800}
    model-read-timeout-ms: ${MODEL_READ_TIMEOUT_MS:1500}
  behavior:
    kafka-topic: ${KAFKA_BEHAVIOR_TOPIC:vibelo.user-behaviors}
  moderation:
    review-token: ${APP_MODERATION_TOKEN:}
  # 号码认证服务短信认证配置
  sms:
    mock: ${APP_SMS_MOCK:false}
    dev-code: ${APP_SMS_DEV_CODE:}
    code-ttl-seconds: ${APP_SMS_CODE_TTL_SECONDS:300}
    cooldown-seconds: ${APP_SMS_COOLDOWN_SECONDS:60}
    provider: aliyun
    aliyun:
      endpoint: ${ALIYUN_PNVS_SMS_ENDPOINT:https://dypnsapi.aliyuncs.com/}
      region-id: ${ALIYUN_PNVS_SMS_REGION_ID:cn-hangzhou}
      access-key-id: ${ALIYUN_PNVS_SMS_ACCESS_KEY_ID:${ALIYUN_SMS_ACCESS_KEY_ID:}}
      access-key-secret: ${ALIYUN_PNVS_SMS_ACCESS_KEY_SECRET:${ALIYUN_SMS_ACCESS_KEY_SECRET:}}
      sign-name: ${ALIYUN_PNVS_SMS_SIGN_NAME:速通互联验证码}
      template-code: ${ALIYUN_PNVS_SMS_TEMPLATE_CODE:100001}
      country-code: ${ALIYUN_PNVS_SMS_COUNTRY_CODE:86}
      scheme-name: ${ALIYUN_PNVS_SMS_SCHEME_NAME:}
      duplicate-policy: ${ALIYUN_PNVS_SMS_DUPLICATE_POLICY:1}
      interval-seconds: ${ALIYUN_PNVS_SMS_INTERVAL_SECONDS:${app.sms.cooldown-seconds}}
      return-verify-code: ${ALIYUN_PNVS_SMS_RETURN_VERIFY_CODE:false}
      auto-retry: ${ALIYUN_PNVS_SMS_AUTO_RETRY:1}
      request-timeout-ms: ${ALIYUN_PNVS_SMS_REQUEST_TIMEOUT_MS:6000}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:rangwaz-media}
      object-url-prefix: ${APP_STORAGE_MINIO_OBJECT_URL_PREFIX:/media/object}
  search:
    elasticsearch-url: ${ELASTICSEARCH_URL:http://localhost:9200}
    index-name: ${ELASTICSEARCH_INDEX_NAME:rangwaz-images}
    connect-timeout-ms: 800
    read-timeout-ms: 2500
    reindex-batch-size: 500
    fail-fast-on-startup: ${ELASTICSEARCH_FAIL_FAST_ON_STARTUP:false}
    index-retry-delay-ms: ${ELASTICSEARCH_INDEX_RETRY_DELAY_MS:30000}
  content-safety:
    enabled: ${CONTENT_SAFETY_ENABLED:false}
    text:
      enabled: ${CONTENT_SAFETY_TEXT_ENABLED:false}
    image:
      enabled: ${CONTENT_SAFETY_IMAGE_ENABLED:false}
      sample-max-width: 160
      high-skin-ratio: 0.68
      high-largest-component-ratio: 0.40
      medium-skin-ratio: 0.54
      medium-largest-component-ratio: 0.34
      center-skin-ratio: 0.52
      lower-skin-ratio: 0.50
    cloud:
      enabled: ${CONTENT_SAFETY_CLOUD_ENABLED:false}
      provider: ${CONTENT_SAFETY_CLOUD_PROVIDER:local-model}
      fail-closed: ${CONTENT_SAFETY_CLOUD_FAIL_CLOSED:true}
      model:
        url: ${CONTENT_SAFETY_MODEL_URL:http://127.0.0.1:8093/moderate/image}
        request-timeout-ms: ${CONTENT_SAFETY_MODEL_REQUEST_TIMEOUT_MS:8000}
        max-base64-bytes: ${CONTENT_SAFETY_MODEL_MAX_BASE64_BYTES:8388608}
      aliyun:
        endpoint: ${ALIYUN_CONTENT_SAFETY_ENDPOINT:https://green-cip.cn-shanghai.aliyuncs.com/}
        region-id: ${ALIYUN_CONTENT_SAFETY_REGION_ID:cn-shanghai}
        access-key-id: ${ALIYUN_CONTENT_SAFETY_ACCESS_KEY_ID:${ALIYUN_SMS_ACCESS_KEY_ID:}}
        access-key-secret: ${ALIYUN_CONTENT_SAFETY_ACCESS_KEY_SECRET:${ALIYUN_SMS_ACCESS_KEY_SECRET:}}
        service: ${ALIYUN_CONTENT_SAFETY_SERVICE:baselineCheck}
        request-timeout-ms: ${ALIYUN_CONTENT_SAFETY_REQUEST_TIMEOUT_MS:8000}
        max-base64-bytes: ${ALIYUN_CONTENT_SAFETY_MAX_BASE64_BYTES:4194304}
