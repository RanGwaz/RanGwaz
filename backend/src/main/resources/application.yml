# Backend runtime configuration for local development.
server:
  port: 8080
spring:
  application:
    name: rangwaz-image-site
  datasource:
    url: jdbc:mysql://localhost:3306/rangwaz_image_dev?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: rangwaz
    password: rangwaz123
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 800ms
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        linger.ms: 20
        batch.size: 32768
    consumer:
      group-id: vibelo-behavior-writer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 60MB
  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.rangwaz.imagesite.entity
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
app:
  upload-root: storage/uploads
  public-upload-prefix: /uploads
  recommendation:
    vector-service-url: http://127.0.0.1:8091
    vector-enabled: true
  behavior:
    kafka-topic: vibelo.user-behaviors
  storage:
    minio:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: rangwaz-media
      object-url-prefix: /media/object
