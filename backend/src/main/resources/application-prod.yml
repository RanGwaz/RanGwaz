server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:4}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:1200ms}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
  sql:
    init:
      mode: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  features:
    publishing-enabled: ${APP_FEATURE_PUBLISHING_ENABLED:true}
  web:
    allowed-origin-patterns: ${APP_WEB_ALLOWED_ORIGIN_PATTERNS}
  auth:
    token-secret: ${APP_AUTH_TOKEN_SECRET}
    token-ttl-seconds: ${APP_AUTH_TOKEN_TTL_SECONDS:86400}
  sms:
    mock: false
    dev-code: ""
  recommendation:
    vector-service-url: ${VECTOR_SERVICE_URL:http://127.0.0.1:8091}
    vector-enabled: true
    model-service-url: ${MODEL_SERVICE_URL:http://127.0.0.1:8092}
    model-recall-enabled: true
    model-ranking-enabled: true
    model-connect-timeout-ms: ${MODEL_CONNECT_TIMEOUT_MS:800}
    model-read-timeout-ms: ${MODEL_READ_TIMEOUT_MS:1800}
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:rangwaz-media}
      object-url-prefix: ${APP_STORAGE_MINIO_OBJECT_URL_PREFIX:/media/object}
  search:
    elasticsearch-url: ${ELASTICSEARCH_URL:http://127.0.0.1:9200}
  moderation:
    review-token: ${APP_MODERATION_TOKEN}
  content-safety:
    cloud:
      enabled: ${CONTENT_SAFETY_CLOUD_ENABLED:true}
      fail-closed: true
